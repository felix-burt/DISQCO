[project]
name = "disqco"
version = "0.0.5"
description = "DIStributed Quantum Circuit Optimisation"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*" # qiskit-aer does not build for >3.12
dependencies = [
    "numpy",
    "qiskit",
    "qiskit-aer",
    "qiskit-qasm3-import",
    "networkx",
    "matplotlib",
    "pylatexenc",
    "jupyter-tikz",
    "ipykernel",
    "pytest",
    "tqdm",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
